
# Define a network, which allows containers to communicate
# with each other, by using their container name as a hostname
# Define una red "externa": debe existir antes de levantar el compose.
# Crearla la primera vez con:  docker network create my_network
# (permite que otros servicios/composes compartan la misma red por nombre)
networks:
  my_network:
    external: true
    name: my_network
